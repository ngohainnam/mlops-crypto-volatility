apiVersion: v1
kind: Secret
metadata:
  name: mlflow-credentials
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "set credentials.postgresPassword (from .env)" .Values.credentials.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.credentials.postgresDb | quote }}
  MINIO_ROOT_USER: {{ .Values.credentials.minioUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "set credentials.minioPassword (from .env)" .Values.credentials.minioPassword | quote }}
