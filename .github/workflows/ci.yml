name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs uv and caches its download cache, keyed on uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # --frozen: fail if uv.lock is out of date instead of silently re-resolving.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  images:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, trainer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GHCR image names must be lowercase; the owner name may not be.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mlops-crypto-volatility-${{ matrix.image }}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -f docker/${{ matrix.image }}.Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # GitOps: write the new tag into Git; ArgoCD in the cluster pulls it. CI never touches the cluster.
  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One bump at a time: two parallel bumps edit the same line and the second one conflicts.
    concurrency: {group: deploy, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main       # latest main, not the pushed commit, so earlier bumps are already in
          fetch-depth: 0  # full history for the ancestry check below
      - name: Bump API image tag
        run: |
          # A newer code push has its own run that will deploy it; never roll back to this older SHA.
          if git log --format=%an "${GITHUB_SHA}..HEAD" | grep -qv '^github-actions\[bot\]$'; then
            echo "Newer commits on main; skipping bump for ${GITHUB_SHA}"; exit 0
          fi
          sed -i "s/^  tag: .*/  tag: ${GITHUB_SHA}/" helm/api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): api image ${GITHUB_SHA::7} [skip ci]"
          # Another push may have landed while images built; rebase onto it before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
